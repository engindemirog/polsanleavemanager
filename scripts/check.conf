# scripts/check.conf — Polsan Leave Manager (Python 3.12 · uv · FastAPI · SQLite)
# Format: <name>: <command> — runs in order, fails fast. [fast] in the NAME = also in --fast.
# Resource hygiene inventory (docs/testing.md): uv, ruff, mypy, lint-imports and pytest are
# run-once processes — no daemon (never dmypy, never ruff --watch, never pytest-xdist).
# resource hygiene: no lock/env mutation during check (--frozen: use uv.lock as-is, no resolve)

lock [fast]: uv lock --check
lint [fast]: uv run --frozen ruff check .
format [fast]: uv run --frozen ruff format --check .
types [fast]: uv run --frozen mypy

# Split by selector, never by list (docs/testing.md rule 4): "not e2e" ∪ "e2e" = every test.
# Module boundary rules run here too (tests/architecture_rules.py; docs/architecture.md).
test-unit-integration [fast]: uv run --frozen pytest -m "not e2e" -p no:cacheprovider
# resource hygiene: single worker, headless; the app under test (uvicorn) is started and stopped
# by the e2e session fixture, including on failure and timeout.
# test-e2e: uv run --frozen pytest -m e2e --browser chromium
