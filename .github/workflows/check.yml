name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain for scripts/check.conf (bootstrap): uv installs Python 3.12 from .python-version.
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --frozen
      - name: Install e2e browser (docs/testing.md)
        run: uv run --frozen playwright install --with-deps chromium
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi

  audit:
    # Dependency CVE scan (docs/security.md, Dependencies) — needs network, so it lives in CI,
    # not in scripts/check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit on the locked dependency set
        run: |
          uv export --frozen --all-groups --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  residue:
    # Resource hygiene proof (docs/testing.md): check twice back to back leaves nothing running —
    # on a clean runner, so no other activity is mistaken for a survivor. Both profiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --frozen
      - name: Install e2e browser (docs/testing.md)
        run: uv run --frozen playwright install --with-deps chromium
      - name: Residue test (full profile)
        run: ./scripts/residue
      - name: Residue test (fast profile)
        run: ./scripts/residue --fast
